text_emb_dim: 768
struct_emb_dim: 200
fusion_dim: 512

text_adapter_dim: 768
struct_adapter_dim: 200

dynamics_layers: 2

adapter_dropout: 0.1
dropout: 0.2

learning_rate: 0.001
weight_decay: 0.00001
min_lr: 1e-5
warmup_ratio: 0.1
grad_clip_norm: 1.0
num_epochs: 150
early_stopping_patience: 5
eval_every: 1

batch_size: 512
eval_batch_size: 64
candidate_batch_size: 1024

temperature: 0.07
decoder: convtranse
convtranse_channels: 50
convtranse_kernel_size: 3
cache_static_candidates: false

data_dir: data-processed/icews14s
output_dir: output/icews14s-temporal

temporal_enabled: true
temporal_alpha: 0.5
temporal_time_scale: 0.01
history_len: 3
temporal_context_k: 32
snapshot_gnn_layers: 2

context_agg: mean

device: cuda
seed: 42

save_eval_predictions: true
eval_topk: 10
eval_predictions_dir: output/icews14s-temporal/predictions
